[package]
name = "aruaru-ime-core"
description = "aruaru-IME core: romaji/kana engine, input-mode prediction from screen context, LLM-assisted conversion."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 型付き構造体へ直接読む高速JSON(SIMD)。大きな辞書(JMdict等)の読み込み用。方針の正本はRS-JSON。
sonic-rs = "0.5"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
quick-xml = "0.36"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lopdf = "0.34"
encoding_rs = "0.8"
