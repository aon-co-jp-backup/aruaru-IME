[package]
name = "aruaru-ime-core"
description = "aruaru-IME core: romaji/kana engine, input-mode prediction from screen context, LLM-assisted conversion."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
quick-xml = "0.36"
sha2 = "0.10"
lopdf = "0.34"
encoding_rs = "0.8"
