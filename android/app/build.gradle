plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.aon.aruaruime'
    compileSdk 34
    defaultConfig {
        applicationId 'jp.aon.aruaruime'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '0.2.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
