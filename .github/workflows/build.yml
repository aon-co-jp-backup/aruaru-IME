name: build
# Windows 版と同じコア・常駐エンジンを Windows / macOS / Linux でビルド・試験し、macOS / Linux 用のインストーラー(tar.gz)と
# Android アプリ(APK)を作る。v* タグでは、それらを GitHub Releases に添付する。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: ubuntu-latest
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/aon-co-jp/RPoem ../RPoem
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release -p aruaru-ime-core
      - run: cargo build --release -p aruaru-ime-daemon -p aruaru-ime-cli
      - name: Smoke test (engine end to end)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then D=target/release/aruaru-ime-daemon.exe; else D=target/release/aruaru-ime-daemon; fi
          sh tools/e2e-smoke.sh "$PWD/$D"
      - name: Generate the shared front end for every OS
        run: cargo run --release -p aruaru-ime-cli -- frontends dist/frontends
      - name: Package (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          P=aruaru-ime-${{ matrix.name }}
          mkdir -p "dist/$P"
          cp target/release/aruaru-ime-daemon target/release/aruaru-ime "dist/$P/"
          cp installer/unix/install.sh installer/unix/uninstall.sh "dist/$P/"
          cp -r dist/frontends "dist/$P/frontends"
          tar -C dist -czf "dist/$P.tar.gz" "$P"
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: pkg-${{ matrix.name }}
          path: dist/aruaru-ime-${{ matrix.name }}.tar.gz
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: aruaru-ime-frontends
          path: dist/frontends
  android-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/aon-co-jp/RPoem ../RPoem
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t arm64-v8a build --release -p aruaru-ime-core
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk aruaru-ime-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-android
          path: aruaru-ime-android.apk
  install-test:
    # 実際に配るパッケージ(tar.gz)を、そのまま入れて・動かして・消す(macOS / Linux)
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: pkg
      - name: Install, convert with the real dictionary, uninstall
        shell: bash
        run: |
          set -e
          tar -xzf pkg/aruaru-ime-${{ matrix.name }}.tar.gz -C pkg
          cd pkg/aruaru-ime-${{ matrix.name }}
          sh ./install.sh
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4660/health && break; sleep 1; done
          curl -fs http://127.0.0.1:4660/health | grep -q "dict=1225528" || { echo "dictionary not loaded"; exit 1; }
          post() { curl -fs -X POST "http://127.0.0.1:4660$1" -d "$2"; }
          post /session '{"sid":"i","op":"lang","lang":"ja"}' >/dev/null
          R=""
          for c in t a i o u; do R="$(post /key "{\"sid\":\"i\",\"key\":{\"Char\":\"$c\"}}")"; done
          echo "$R" | cut -c1-200
          echo "$R" | grep -q '対応' || { echo "kanji conversion failed"; exit 1; }
          sh ./uninstall.sh
          sleep 2
          if curl -fs http://127.0.0.1:4660/health >/dev/null 2>&1; then echo "engine still running after uninstall"; exit 1; fi
          echo "INSTALL TEST OK"
  android-test:
    # APK をエミュレーター(スマホ・タブレット)に入れて起動し、画面の文字を確認する
    needs: android-apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: pixel_6
            name: phone
          - profile: pixel_c
            name: tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pkg-android
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: bash tools/android-smoke.sh apk/aruaru-ime-android.apk ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-${{ matrix.name }}
          path: android-test-${{ matrix.name }}*
  release:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [engine, android-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: out
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release upload "${{ github.ref_name }}" out/* --clobber --repo "${{ github.repository }}"
